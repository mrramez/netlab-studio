version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # One pull request for all minor and patch updates. Major updates stay separate, so each
      # one gets its own review.
      maven-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The spec targets the JavaFX 21 LTS line: accept 21.0.x updates only.
      - dependency-name: org.openjfx:javafx-controls
        update-types: [version-update:semver-major]
      - dependency-name: org.openjfx:javafx-fxml
        update-types: [version-update:semver-major]
      # The spec targets JUnit 5. Moving to JUnit 6 is a deliberate decision, not a routine bump.
      - dependency-name: org.junit:junit-bom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      # All actions in one pull request, so related actions are never bumped separately. This
      # matters for github/codeql-action: its init and analyze steps must use the same version.
      github-actions:
        patterns:
          - "*"
